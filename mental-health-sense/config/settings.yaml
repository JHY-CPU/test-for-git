# ===== 全局配置 =====
project:
  name: "mental-health-sense"
  version: "1.0.0"

# ===== 数据路径 =====
paths:
  raw_data: "./data/raw/"
  features: "./data/features/"
  baselines: "./data/baselines/"
  logs: "./data/logs/"

# ===== GRU 模型参数 =====
gru:
  feature_dim: 6  # 已移除时间编码与语音声学维，现在只有6维健康特征
  hidden_dim: 16
  num_layers: 1
  window: 7
  dropout: 0.2

# ===== 训练参数 =====
training:
  initial:
    build_days: 21           # 建档期天数（→ build_days-7 个训练样本）。14 天(7样本)过拟合明显：
                             # 多种子实验中训练残差仅为留出残差的一半，单天静态判定 FPR 高；
                             # 提到 21 天(14样本)后过拟合 gap 减 1/3、FPR 大幅下降、检出率不变。
                             # 代价是多等 7 天建档盲区（有冷启动兜底顶着）。详见 docs/TRAINING.md。
    epochs: 150
    lr: 0.001
    patience: 20             # early-stopping：连续N轮loss无改善则提前停止（防小样本过拟合）
  finetune:
    epochs: 50
    lr: 0.0003
    patience: 10             # early-stopping：微调也启用（与冷启动一致），抑制小样本过拟合
    recent_days: 30
    residual_merge_alpha: 0.3
    exclude_deviation_days: true  # 微调只用被判为正常(is_deviation=False)的天，防基线被异常期污染

# ===== 训练数据健康门禁 =====
# 冷启动前对建档期数据做MAD离群筛查，剔除可疑异常天，防止GRU把异常学成正常基线
data_health:
  z_threshold: 3.5           # modified z-score阈值，超过视为该特征离群
  min_bad_features: 2        # 一天中离群特征数达到此值则整天判为离群
  max_outlier_ratio: 0.5     # 离群天占比超过此值则拒绝建档（数据整体异常，建议顺延）

# ===== 冷启动兜底 =====
# GRU基线就绪前，用滑动均值/标准差做基础离群检测，消除头两周监测盲区
cold_start:
  fallback_enabled: true
  fallback_min_days: 5       # 至少积累N天有效数据才启用兜底
  fallback_lookback: 14      # 滑动基线回看窗口（天）
  fallback_sigma: 3.0        # 加权z-score超过此值判为偏离（比GRU轨更保守，减少误报）

# ===== EWMA 参数 =====
ewma:
  alpha: 0.05
  min_samples_for_dynamic: 20

# ===== 风险判定阈值 =====
risk:
  sigma_multiplier: 2.5
  # 异常分数阈值（用于判定等级）
  anomaly_score_thresholds:
    high_spike: 1.5      # 单日高峰值阈值（触发关注级别）
    sustained_avg: 1.0   # 连续期平均值阈值（配合连续天数判定提醒级别）
  consecutive:
    attention: 1
    warning: 3
    severe: 5
  # 冷启动观察期（训练后多少天内不触发报警，仅记录）
  cold_start_observation_days: 7

# ===== 调度 =====
scheduler:
  daily_time: "02:00"
  weekly_day: 6
  weekly_time: "03:00"

# ===== 预警推送 =====
alert:
  level_1:
    action: "log_only"
    notify: false
  level_2:
    action: "push_notification"
    notify: ["children"]
  level_3:
    action: "force_notification"
    notify: ["children", "community_worker"]

# ===== LLM 周报 =====
report:
  model: "claude-sonnet-5"
  max_tokens: 400
  template: "weekly_report_v1"
