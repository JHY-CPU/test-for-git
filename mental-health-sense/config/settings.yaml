# ===== 全局配置 =====
project:
  name: "mental-health-sense"
  version: "1.0.0"

# ===== 数据路径 =====
paths:
  raw_data: "./data/raw/"
  features: "./data/features/"
  baselines: "./data/baselines/"
  logs: "./data/logs/"

# ===== GRU 模型参数（双轨）=====
# 睡眠轨与社会连接轨各自独立一个 GRU，互不干扰：
#   - 信号不被稀释（旧单轨把两类残差平均成一个分，睡眠恶化会被社交正常拉平）
#   - 故障隔离（小贝壳掉线时社交轨照常出结果，反之亦然）
#   - 抑制过拟合（两个小模型比一个 13 维大模型稳）
gru:
  window: 7                  # 两轨共用：用过去 7 天预测第 8 天
  num_layers: 1
  dropout: 0.2
  sleep:
    feature_dim: 8
    hidden_dim: 8            # 设计文档给 12（896 参数），此处降到 8（504 参数）。
                             # 理由：hidden=12 时参数量远超训练序列数，模型会记住序列而非学出
                             # 基线 → 训练残差≈0 → residual_stats.std≈0 → 阈值分母趋零 →
                             # 建档期一过就疯狂误报。降到 8 并配合 holdout 估阈值切断这条链。
  social:
    feature_dim: 5
    hidden_dim: 8            # 5 维输入配 8 隐藏（405 参数），维持约 1.5× 输入维的比例

# ===== 训练参数 =====
training:
  initial:
    build_days: 35           # 建档期天数。设计文档要求睡眠轨≥14天、社交轨≥21天（覆盖3个完整周，
                             # 否则学不到"周末子女来访"这个正常模式，第一个周末就误报）。
                             # 35 天同时满足两轨下限，且保留原有实证结论：21 样本时过拟合 gap
                             # 仍偏大，28 样本后基本收敛。详见 docs/TRAINING.md。
    holdout_days: 7          # ★ 从建档期末尾切出的留出段，专用于估残差统计与冻结阈值。
                             # 绝不能用训练集残差估阈值——模型对训练集的残差被压得极小，
                             # 会让 std 趋零、阈值失去宽度。留出段是模型没见过的日子，
                             # 残差尺度才反映真实预测误差。
                             # 35 天 = 7(窗口) + 21(训练序列) + 7(留出序列)
    epochs: 150
    lr: 0.001
    patience: 20             # early-stopping：连续N轮loss无改善则提前停止（防小样本过拟合）
  finetune:
    epochs: 50
    lr: 0.0003
    patience: 10             # early-stopping：微调也启用（与冷启动一致），抑制小样本过拟合
    recent_days: 30
    residual_merge_alpha: 0.3
    exclude_deviation_days: true  # 微调只用被判为正常(is_deviation=False)的天，防基线被异常期污染

# ===== 训练数据健康门禁 =====
# 冷启动前对建档期数据做MAD离群筛查，剔除可疑异常天，防止GRU把异常学成正常基线
data_health:
  z_threshold: 3.5           # modified z-score阈值，超过视为该特征离群
  min_bad_features: 2        # 一天中离群特征数达到此值则整天判为离群
  max_outlier_ratio: 0.5     # 离群天占比超过此值则拒绝建档（数据整体异常，建议顺延）

# ===== 冷启动兜底 =====
# GRU基线就绪前，用滑动均值/标准差做基础离群检测，消除建档期监测盲区。
# 双轨后按轨各自独立兜底：睡眠轨的 GRU 就绪不影响社交轨继续走兜底。
cold_start:
  fallback_enabled: true
  fallback_min_days: 5       # 至少积累N天有效数据才启用兜底
  fallback_lookback: 14      # 滑动基线回看窗口（天）
  fallback_sigma: 3.0        # 加权z-score超过此值判为偏离（比GRU轨更保守，减少误报）

# ===== EWMA 参数 =====
# 算法本身不变（全量累积指数加权，取 min 动态阈值）。双轨后共 3 个池：
#   睡眠轨 1 个（睡眠行为的周内效应弱，不分池）
#   社交轨 2 个（工作日/周末分池）—— 老人社交有强周末效应（子女周末探访），
#   单池会把"周一比周日社交少"当成偏离。
ewma:
  alpha: 0.05
  min_samples_for_dynamic: 20
  # 周末样本只占 2/7，攒 20 个要 70 天。降到 8 需约 8 个周末≈56 天。
  # ⚠️ 诚实说明：这意味着社交轨的周末动态阈值到第 8 周才真正上线，
  # 在此之前周末只有静态阈值。这是周末样本稀疏的算术后果，调参消不掉。
  min_samples_for_dynamic_weekend: 8
  # 偏离日冻结的上限：连续冻结这么多天后强制恢复喂入，让基线重新学习。
  # 此前写死在 TrackEWMAPools.__init__，配置里根本没这个键——而它是
  # docs/TODO.md 里排第一的"永久性变化无限期每日报警"唯一能调的旋钮
  # （实测 PERM_step 连续 91 天每天 L3：冻结按 14 天正常释放、阈值 1.18→1.91，
  #   但 score 4.5 远超其上，重新基线化追不上）。调小能让阈值更快追上，
  # 代价是持续性异常更早被自己的历史掩盖——两头都是坏的，
  # 真正的解法在预警策略层（冷却/去重），不在这里。
  max_freeze_days: 14

# ===== 风险判定阈值 =====
risk:
  sigma_multiplier: 2.5
  # 幅度门槛。★ 单位是 severity = anomaly_score / 当日 dynamic_threshold，不是绝对分。
  #
  # 为什么必须用倍数（这是被两条失效链逼出来的）：
  #   1. 两类轨的 anomaly_score 量纲根本不同。GRU 轨是加权归一化残差
  #      （正常 0.5~1.0、阈值 1.3~1.6）；冷启动兜底轨是稳健加权 |z|
  #      （阈值就是 cold_start.fallback_sigma=3.0，正常天能到 1.77）。
  #      旧的绝对常数 high_spike=1.5 对 GRU 轨是"高峰"，对兜底轨是"再普通不过
  #      的一天"——把兜底轨接进判定层时会让建档期天天误报 L1。
  #   2. 绝对常数还与个人化阈值脱节：E001 的动态阈值在 1.30~1.62 之间浮动，
  #      分数 1.55 那天检测层判"不是偏离"，判级层却因 1.55 > 1.5 报 L1。
  #      个人基线系统里，门槛不该是全局绝对值。
  #
  # 门槛必须 > 1.0：偏离日按定义 severity > 1，取 1.0 等于恒真，
  # "防止擦线偏离仅凭连续天数升到 L3"这条防线会静默失效。
  # 两个门槛的取值不同，因为它们守的不是同一件事：
  #   sustained_severity 只作用在**当前这段连续偏离**上，段内每天按定义都 >1，
  #     所以 1.15 的含义是"整段平均要高出自己阈值 15%，不能全是擦线"。
  #   high_spike_severity 作用在整个 7 天窗（含已经恢复的日子）。活着的偏离
  #     早已被 consecutive>=1 这条路径判成 L1，所以峰值门槛唯一的职责是
  #     "已经恢复了，但前几天那个尖峰高到仍值得保持关注"——这要求明显更高的
  #     bar，否则一次擦线偏离恢复后还会把 L1 挂上好几天。1.5 = 高出阈值一半。
  anomaly_score_thresholds:
    high_spike_severity: 1.5     # 单日峰值：即使已恢复也保持关注的门槛
    sustained_severity: 1.15     # 连续偏离段的平均 severity（配合连续天数判 L2/L3）
  consecutive:
    attention: 1
    warning: 3
    severe: 5

  # 持续性统计的日历语义。
  # "连续 N 天"必须按自然日数，不能按日志记录条数：load_daily_results 取的是最近
  # N 个文件，而两轨全不可用那天根本不生成日志。两者叠加会让设备离线前后的两段
  # 偏离被拼成一段——实测 5 条日志跨越 22 个日历日仍数出 consecutive=5 → L3。
  #
  # 缺日与 degraded 日同样处理："既不累加也不打断"，但连续跳过超过 max_skip_days
  # 就打断。超过三天没有可信数据，不该再假装这是同一段状态。
  # 取 3：超过三天没有可信数据，就不该再假装这是同一段状态。
  continuity:
    max_skip_days: 3
  # 冷启动观察期（已取消：建档期延长到 35 天，EWMA 初始 =28 样本，动态阈值直接稳定）
  cold_start_observation_days: 0

  # ===== 三类风险的持续性门槛（设计文档 6.3）=====
  # threshold_ratio = 单个特征的 signed_z 需超过多少倍才算“方向性超标”。
  # 取值原则：**AND 的条件越多，每个条件的门槛可以越低**，联合误报率才可比。
  #   sleep_stability      2 必选 + 1 可选（可选池 3 选 1）→ 1.5
  #   circadian_disruption 2 必选 + 1 可选（可选池仅 1 项）→ 1.5
  #   social_decline       3 项全中、无可选池              → 1.0
  #
  # social_decline 为何单独降到 1.0（端到端实测逼出来的，不是随手调参）：
  #   本轨三个必选维的**变异系数差一个量级**，同一个 ratio 对它们不是同一件事：
  #     activity_counts  CV≈13%（185±25）    → 退缩期 z 稳定在 −3.1~−4.1
  #     copresence_min   CV≈36%（55±20，且周末 ×2.4）→ 退缩期 z 只有 −1.09~−1.26
  #   两者原始跌幅都在 10 倍上下（copresence 57→6），但 copresence 的
  #   normalized 跌幅被自身大方差摊薄，残差 std 又被工作日/周末双峰抬高
  #   （residual_stats 是合池估计的，7 天留出段切不出两个池）。
  #   叠加 GRU 只看过去 7 天：异常持续到第 3 天后输入窗填满异常日、预测跟着跌，
  #   残差进一步收缩。三项全中的规则于是卡死在 copresence 这一维上。
  #
  #   1.2 时 copresence 的 z 恰好在门槛两侧抖动（−1.09 过不了、−1.26 过得了），
  #   "7 天窗内 5 天"永远凑不满 → 一次共处归零 9 天的社交崩塌报不出类型。
  #   这个配置曾"通过"过端到端验证，只是因为 validate_synthetic.py 当时没固定
  #   torch 随机种子，GRU 初值碰巧让 z 落在门槛之上——是假绿。
  #
  #   降到 1.0 的安全性由**结构**而非单维门槛提供：三项 AND（单维 ~15.9% →
  #   三维 ~0.4%/天）再叠加"7 天滚动窗需 5 天"。TN_short_social 场景
  #   （社交低落仅 4 天）专门守这条线，确认没有拿误报换灵敏度。
  #   根治办法仍是残差统计按周内分池，需要远长于 7 天的留出段，留到真机阶段。
  risk_rules:
    sleep_stability:
      consecutive_days: 3      # 睡眠稳定性偏离：连续 3 天
      threshold_ratio: 1.5
    social_decline:
      rolling_window: 7        # 社会连接减弱：7 天滚动窗内 ≥5 天。
      rolling_required: 5      # 不用"连续5天"——严格连续必然跨周末，而周末社交本来就多，
                               # 会把真实退缩打断成两截、永远凑不满。
      threshold_ratio: 1.0
    circadian_disruption:
      consecutive_days: 5      # 作息节律紊乱：连续 5 天
      consecutive_days_degraded: 7  # 睡眠轨缺失（拿不到 sleep_onset_clock 做交叉验证）时，
                                    # 门槛从 5 天提到 7 天，用更长持续性换可信度
      threshold_ratio: 1.5

# ===== 调度 =====
scheduler:
  # 02:00 → 03:00：小贝壳的睡眠报告窗口延伸到当日 22:59 之后才最终成型，
  # 02:00 拉取可能取到未闭合的报告。
  daily_time: "03:00"
  weekly_day: 6
  weekly_time: "04:00"       # 跟着日任务后移，避免与 03:00 的日任务重叠

# ===== 预警推送 =====
# 由 alert.trigger_alert 读取，缺项回落到 alert.py 的 ALERT_ACTIONS 内置默认。
# notify 统一写列表：level_1 原先写的是 `false`，而代码一路当列表用
# （`for r in False` 会直接抛异常）——这段配置此前根本没人读，才没暴露。
#
# ⚠️ 仍未实现：冷却/去重/抑制。永久性变化会无限期每日重复报同一等级
# （PERM_step 实测连续 91 天每天 L3），见 docs/TODO.md 与 VALIDATION.md §7.3。
alert:
  level_1:
    action: "log_only"
    notify: []
  level_2:
    action: "push_notification"
    notify: ["children"]
  level_3:
    action: "force_notification"
    notify: ["children", "community_worker"]

# ===== LLM 周报 =====
report:
  model: "claude-sonnet-5"
  max_tokens: 400
  template: "weekly_report_v1"

# ===== 抑郁评估（MPDD 旁路通道）=====
#
# ★ 群体绝对基线，与两条 GRU 个人基线轨完全独立：不参与建档 / 微调 / EWMA / 判级。
#   分数绝不与 anomaly_score 做任何算术——尺度不可比（一个是"跟别人比"，一个是
#   "跟你自己平时比"），理由同"绝不跨轨比较绝对分"。睡眠轨和社交轨这两条自家的
#   轨都不敢比，何况训练目标完全不同的外部模型。
#   更要紧的是防正反馈：若抑郁分能标记异常日，异常日会被排除出每周微调，
#   个人基线越缩越窄，反过来又佐证抑郁判定。约束的完整论证见
#   src/depression/__init__.py。
depression:
  enabled: true
  show_in_report: true

  # ⚠️ mpdd_root 不可改动：OpenFace 的 FaceLandmarkImg 把
  # third_party/OpenBLAS/install/lib 的**绝对路径**编译进了 RUNPATH，
  # 移动或改名后启动即报 libopenblas.so.0 找不到。
  mpdd_root: "/home/zhousenyu/project/MPDD-AVG-2026"
  # 独立解释器：MPDD 需要 transformers / librosa / av / cv2 + 几个 G 的权重，
  # 这些刻意不进本项目的 requirements.txt——本仓刚因 pyaudio 缺 portaudio 头文件
  # 导致整条 pip install 中止、torch 一个都装不上（见 requirements.txt 尾部）。
  # 隔离靠进程边界：MPDD 环境炸了，日管道照常跑。
  python_bin: "/home/zhousenyu/software/anaconda3/envs/MPDD/bin/python"
  checkpoint: "checkpoints/Track1/A-V-P/ternary/best_model_2026-04-30-07.18.39.pth"

  # 下面三项任意一个变了，推理数值就会变（batch_size 改变 cuDNN kernel 选择，
  # frame_sample_rate 改变插值到 target_t=128 之前的序列长度，CPU/GPU 是两套
  # 浮点实现）。钉死并写进契约的 provenance，否则历史分数不可比。
  # 实测：同机同版本下 MPDD 推理逐位可复现（无 RNG、全程 .eval()、无反向传播）。
  device: "cuda"
  batch_size: 64
  frame_sample_rate: 1
  timeout_sec: 1800

  clip:
    top_k: 3                 # 一次评估最多取几段
    min_dur: 10.0
    max_dur: 45.0
    crop: "face"             # 重取景贴近训练构图（训练数据是访谈视频）

  assessment:
    min_clips: 2             # 少于此数标 low_confidence——单段结论不可靠
    max_spread_phq9: 6.0     # 段间 PHQ-9 极差超过它标 low_confidence（模型自己在打架）
    valid_days: 30           # 有效期；过期一律显示"暂无最新评估"，绝不拿旧分顶今天

  # ⚠️ 刻意关闭，两个独立原因，任一成立都不该开：
  #   1. alert.py 至今没有冷却 / 去重 / 抑制机制（PERM_step 实测连续 91 天每天
  #      报 L3 = 91 次短信 + 强制响铃 + 网格员）。再加一个预警源只会加速家属
  #      关掉通知，而通知一关，真正的新变化也收不到了。见 VALIDATION §7.3。
  #   2. 当前 checkpoint 在其验证集上对全部 9 个样本预测同一类别
  #      （混淆矩阵 [[6,0,0],[2,0,0],[0,1,0]]，Macro-F1 0.286，Kappa 0.129），
  #      且未在本机位 / 本人身上校准。
  alert: false
